<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: включает env(safe-area-inset-*). Без него инсеты на iOS всегда 0,
         и весь safe-area-код (баннеры PwaStatus, нижняя навигация, отступы main) не работает. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg" />
    <!-- APPLE-2 (F-514): PNG, а не SVG — iOS не поддерживает SVG для иконки на домашнем экране.
         Квадрат без прозрачности: iOS сам накладывает маску скругления. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- манифест инжектит vite-plugin-pwa (manifest.webmanifest) -->

    <!-- Theme color for mobile browsers — copper (фирменный акцент) -->
    <meta name="theme-color" content="#B0500F" />
    <meta name="msapplication-TileColor" content="#B0500F" />
    
    <!-- App meta -->
    <meta name="description" content="ELOM - Система управления материалами и закупками для строительных объектов" />
    <meta name="application-name" content="ELOM" />
    <meta name="apple-mobile-web-app-title" content="ELOM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>ELOM</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
