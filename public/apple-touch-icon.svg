<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="boltFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background for Apple touch icon -->
  <rect width="180" height="180" rx="36" fill="url(#bgGradient)"/>
  
  <!-- Lightning bolt centered with padding -->
  <g transform="translate(30, 20)">
    <path d="M75 0
         H120
         L67.5 70
         H105
         L45 140
         H0
         L52.5 70
         H15 Z" fill="url(#boltFill)" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>

