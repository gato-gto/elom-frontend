      tags:
      - WriteOff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_WriteOffBulkInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_WriteOffBulkInputRequest'
          multipart/form-data:
            schema:
