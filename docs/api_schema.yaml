openapi: 3.0.3
info:
  title: ELOM Frontend API Schema
  version: 2.0.0
  description: Frontend API schema for ELOM - Energy Life management system
servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: https://api.elom.com/v1
    description: Production server
paths:
  /auth/token/:
    post:
      operationId: auth_token_create
      summary: Получить JWT токен
      description: Аутентификация пользователя и получение access/refresh токенов
      tags:
        - Authentication
      requestBody:
        required: true
          content:
            application/json:
              schema:
              type: object
              properties:
                username:
          type: string
                  example: "admin"
                password:
          type: string
                  example: "password123"
              required:
                - username
                - password
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
          type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  refresh:
                    type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        '401':
          description: Неверные учетные данные
  /auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      summary: Обновить access токен
      description: Получение нового access токена по refresh токену
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
              required:
                - refresh
      responses:
        '200':
          description: Токен обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
          type: string
  /users/me:
    get:
      operationId: users_me
      summary: Текущий пользователь
      description: Получение информации о текущем авторизованном пользователе
      tags:
        - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Не авторизован
  /material-categories/:
    get:
      operationId: material_categories_list
      summary: Список категорий материалов
      description: Получение списка категорий с поддержкой иерархии и фильтрации
      tags:
        - Material Categories
      security:
      - jwtAuth: []
      parameters:
        - name: search
          in: query
        schema:
            type: string
          description: Поиск по названию
        - name: parent
          in: query
        schema:
          type: integer
          description: ID родительской категории
        - name: has_parent
          in: query
            schema:
            type: boolean
          description: Только корневые (false) или дочерние (true) категории
        - name: has_children
          in: query
              schema:
            type: boolean
          description: Категории с дочерними элементами
        - name: has_materials
        in: query
        schema:
            type: boolean
          description: Категории с материалами
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaterialCategoryList'
    post:
      operationId: material_categories_create
      summary: Создать категорию
      tags:
        - Material Categories
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
  /material-categories/tree/:
    get:
      operationId: material_categories_tree
      summary: Дерево категорий
      description: Получение иерархического дерева всех категорий
      tags:
        - Material Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Дерево категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryTreeNode'
  /material-categories/children/:
    get:
      operationId: material_categories_children
      summary: Дочерние категории
      description: Получение дочерних категорий для указанной родительской
      tags:
        - Material Categories
      security:
      - jwtAuth: []
      parameters:
        - name: parent_id
          in: query
        schema:
          type: integer
          description: ID родительской категории (0 для корневых)
      responses:
        '200':
          description: Список дочерних категорий
          content:
            application/json:
              schema:
                type: array
                items:
                $ref: '#/components/schemas/MaterialCategoryLite'
  /audit-logs/:
    get:
      operationId: audit_logs_list
      summary: Журнал аудита
      description: Просмотр журнала аудита системы (доступно только admin/director)
      tags:
        - Audit Logs
      security:
      - jwtAuth: []
      parameters:
        - name: user
          in: query
        schema:
          type: integer
          description: ID пользователя
        - name: action
          in: query
        schema:
          type: string
          description: Действие (create, update, delete, etc.)
        - name: model
          in: query
        schema:
          type: string
          description: Модель (Unit, Material, Purchase, etc.)
        - name: ts_from
        in: query
        schema:
          type: string
            format: date-time
          description: С даты
        - name: ts_to
        in: query
        schema:
          type: string
            format: date-time
          description: По дату
      responses:
        '200':
          description: Список записей аудита
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
  /purchases/{id}/photos/:
    get:
      operationId: purchase_photos_list
      summary: Список фото закупки
      description: Получение всех фото закупки
      tags:
        - Purchase Photos
      security:
      - jwtAuth: []
      parameters:
        - name: id
          in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Список фото
          content:
            application/json:
              schema:
                type: array
                        items:
                  $ref: '#/components/schemas/PurchasePhoto'
    post:
      operationId: purchase_photos_upload
      summary: Загрузить фото
      description: Загрузка фото закупки
      tags:
        - Purchase Photos
      security:
      - jwtAuth: []
      parameters:
        - name: id
          in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                type: string
                format: binary
                is_cover:
          type: boolean
                  default: false
              required:
                - photo
      responses:
        '201':
          description: Фото загружено
  /purchases/{id}/photos/{photo_id}/:
    delete:
      operationId: purchase_photos_delete
      summary: Удалить фото
      description: Удаление фото закупки
      tags:
        - Purchase Photos
      security:
      - jwtAuth: []
      parameters:
        - name: id
          in: path
        required: true
            schema:
            type: integer
        - name: photo_id
          in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Фото удалено
        '404':
          description: Фото не найдено
  /purchases/{id}/photos/{photo_id}/set-cover/:
    post:
      operationId: purchase_photos_set_cover
      summary: Установить обложку
      description: Установка фото как обложки закупки
      tags:
        - Purchase Photos
      security:
      - jwtAuth: []
      parameters:
        - name: id
          in: path
        required: true
        schema:
          type: integer
        - name: photo_id
          in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Обложка установлена
          content:
            application/json:
              schema:
      type: object
      properties:
                  detail:
          type: string
                    example: "Cover photo updated"
        '404':
          description: Фото не найдено
components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [admin, director, coordinator, buyer, site_manager]
      required:
        - id
      - username
        - role
    MaterialCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          nullable: true
        children_count:
          type: integer
        materials_count:
          type: integer
        full_path:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
        - children_count
        - materials_count
        - full_path
    MaterialCategoryLite:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent:
          type: integer
          nullable: true
      required:
      - id
      - name
    MaterialCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        parent:
          type: integer
          nullable: true
      required:
      - name
    CategoryTreeNode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent:
          type: integer
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeNode'
      required:
        - id
        - name
        - children
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        ts:
          type: string
          format: date-time
        user:
          type: integer
          nullable: true
        user_name:
          type: string
        user_role:
          type: string
          nullable: true
        action:
          type: string
        action_display:
          type: string
        model:
          type: string
        model_display:
          type: string
        object_id:
          type: string
        detail:
          type: string
        ip:
          type: string
          nullable: true
      required:
        - id
        - ts
        - user_name
        - action
        - action_display
        - model
        - model_display
    PurchasePhoto:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        is_cover:
          type: boolean
        mime:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - id
      - url
        - is_cover
        - created_at
    PaginatedMaterialCategoryList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/MaterialCategory'
      required:
        - count
        - results
    PaginatedAuditLogList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
      required:
        - count
        - results