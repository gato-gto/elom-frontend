        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 6
                  description: Новый пароль
              required:
              - password
            examples:
              УстановкаНовогоПароля:
                value:
                  password: NewStrongPass123!
