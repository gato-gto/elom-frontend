openapi: 3.0.3
info:
  title: ELOM API
  version: 1.0.0
  description: Energy Life — учёт закупок, остатки, архив, отчёты (v1)
paths:
  /api/v1/archive/:
    get:
      operationId: archive_list
      description: Архивные периоды (месяц×объект), отсортированы по убыванию месяца.
      summary: Список закрытых периодов
      parameters:
      - in: query
        name: closed_at_from
        schema:
          type: string
          format: date-time
      - in: query
        name: closed_at_to
        schema:
          type: string
          format: date-time
      - in: query
        name: closed_by
        schema:
          type: number
      - in: query
        name: closed_by_name
        schema:
          type: string
      - in: query
        name: month
        schema:
          type: string
          format: date
      - in: query
        name: month_from
        schema:
          type: string
          format: date
      - in: query
        name: month_number
        schema:
          type: number
      - in: query
        name: month_to
        schema:
          type: string
          format: date
      - in: query
        name: object
        schema:
          type: integer
        description: Фильтр по объекту (если предусмотрен в фильтре)
      - in: query
        name: object_name
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: month|closed_at (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: number
      tags:
      - Archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArchivePeriodList'
              examples:
                ПримерОтвета(страница):
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 3
                        month: '2025-09-01'
                        object: 1
                        object_name: Объект А
                        closed_at: '2025-09-30T18:05:00Z'
                        closed_by: 2
                        closed_by_name: Director
                  summary: Пример ответа (страница)
          description: ''
    post:
      operationId: archive_create
      description: Создать запись об архивном периоде. Используйте action close для
        закрытия периода.
      summary: Создать архивный период
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
          description: ''
  /api/v1/archive/{id}/:
    get:
      operationId: archive_retrieve
      description: Получить информацию о закрытом периоде по ID.
      summary: Получить архивный период
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - Archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
          description: ''
    put:
      operationId: archive_update
      description: Обновление архивных периодов запрещено.
      summary: Обновить архивный период (запрещено)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '400':
          description: Архивные периоды нельзя редактировать
    patch:
      operationId: archive_partial_update
      description: Обновление архивных периодов запрещено.
      summary: Частичное обновление архивного периода (запрещено)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArchivePeriodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArchivePeriodRequest'
      security:
      - jwtAuth: []
      responses:
        '400':
          description: Архивные периоды нельзя редактировать
    delete:
      operationId: archive_destroy
      description: Удаление архивных периодов запрещено. Используйте action reopen
        для открытия периода.
      summary: Удалить архивный период (запрещено)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - Archive
      security:
      - jwtAuth: []
      responses:
        '400':
          description: Архивные периоды нельзя удалять
  /api/v1/archive/close/:
    post:
      operationId: archive_close_create
      description: "\n        Закрывает период для объекта, помечая все закупки и\
        \ снимки за указанный месяц как архивированные.\n        \n        **Бизнес-логика:**\n\
        \        - Устанавливает `is_archived=True` для всех закупок за месяц\n  \
        \      - Устанавливает `is_archived=True` для всех снимков за месяц\n    \
        \    - Создает запись в `ArchivePeriod`\n        - Запрещает редактирование\
        \ архивированных данных\n        \n        **Права доступа:**\n        - Только\
        \ директора и администраторы\n        - Координаторы для своих объектов\n\
        \        "
      summary: Закрыть период (месяц×объект)
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: 'Месяц в формате YYYY-MM (например: 2024-01)'
        required: true
      - in: query
        name: object
        schema:
          type: integer
        description: ID объекта
        required: true
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
            examples:
              ПримерУспешногоОтвета:
                value:
                  id: 4
                  month: '2025-09-01'
                  object: 1
                  object_name: Объект А
                  closed_at: '2025-09-30T18:05:00Z'
                  closed_by: 2
                  closed_by_name: Director
                summary: Пример успешного ответа
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
              examples:
                ПримерУспешногоОтвета:
                  value:
                    id: 4
                    month: '2025-09-01'
                    object: 1
                    object_name: Объект А
                    closed_at: '2025-09-30T18:05:00Z'
                    closed_by: 2
                    closed_by_name: Director
                  summary: Пример успешного ответа
          description: ''
        '400':
          description: Ошибка валидации
        '403':
          description: Нет прав доступа
        '404':
          description: Объект не найден
  /api/v1/archive/periods/:
