        \        **Права доступа:**\n        - Только admin\n        \n        **Примечание:**\
        \ Сотрудник не может сменить пароль себе через этот endpoint.\n        Для\
        \ самостоятельной смены пароля используйте другой механизм.\n        "
      summary: Сменить пароль сотруднику
