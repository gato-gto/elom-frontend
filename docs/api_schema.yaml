  /api/v1/users/me:
    get:
      operationId: auth_me
      description: "\n        Возвращает профиль авторизованного пользователя с информацией\
        \ о роли.\n        \n        **Роли в системе (RBAC):**\n        - `admin`\
        \ — Администратор (полный доступ ко всем функциям)\n        - `manager` —\
        \ Управляющий (полный доступ без учета изменений)\n        - `warehouse` —\
        \ Склад/Цех/Проект (полный доступ без учета изменений)\n        - `brigadier`\
        \ — Бригадир/Инженер (работа с назначенными объектами)\n        - `requester`\
        \ — Заявитель (просмотр и подача заявок на материалы)\n        "
      summary: Профиль текущего пользователя
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                ПримерОтвета:Управляющий:
                  value:
                    id: 1
                    username: manager
                    email: manager@elom.uz
                    first_name: Иван
                    last_name: Управляющий
                    roles:
                    - id: 2
                      name: manager
                      display_name: Управляющий
                    is_active: true
                  summary: 'Пример ответа: Управляющий'
                ПримерОтвета:Бригадир:
                  value:
                    id: 5
                    username: brigadier1
                    email: brigadier1@elom.uz
                    first_name: Азиз
                    last_name: Бригадиров
                    roles:
                    - id: 4
                      name: brigadier
                      display_name: Бригадир/Инженер
                    is_active: true
                  summary: 'Пример ответа: Бригадир'
          description: ''
        '401':
          description: Не авторизован. Требуется JWT токен.
