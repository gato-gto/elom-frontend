  /api/v1/rbac/my-permissions/:
    get:
      operationId: rbac_my_permissions_retrieve
      description: "\n    Получить все разрешения текущего авторизованного пользователя.\n\
        \    \n    **Возвращает:**\n    - Список всех разрешений пользователя (с учетом\
        \ ролей и персональных переопределений)\n    - Список ролей пользователя (только\
        \ для отображения в UI, не для логики доступа)\n    \n    **Используется фронтендом\
        \ для:**\n    - Проверки доступа к функциям и маршрутам\n    - Условного отображения\
        \ элементов UI (кнопки, формы, меню)\n    - Адаптации интерфейса под права\
        \ пользователя\n    \n    **Примечание:**\n    - Суперпользователи (is_superuser=True)\
        \ получают все разрешения автоматически\n    - Разрешения вычисляются с учетом\
        \ иерархии ролей (родительские роли)\n    - Персональные переопределения (UserPermissionOverride)\
        \ имеют приоритет над ролями\n    "
      summary: Мои разрешения
      tags:
      - RBAC
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissionsResponse'
              examples:
                ПримерОтвета:
                  value:
                    permissions:
                    - id: 1
                      codename: materials.create
                      resource: materials
                      action: create
                      name: Создание материалов
                    - id: 2
                      codename: purchases.view
                      resource: purchases
                      action: view
                      name: Просмотр закупок
                    roles:
                    - id: 1
                      name: admin
                      display_name: Администратор
                      is_system: true
                  summary: Пример ответа
          description: ''
        '401':
          description: Не авторизован
  /api/v1/rbac/permissions/:
