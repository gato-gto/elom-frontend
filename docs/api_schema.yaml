openapi: 3.0.3
info:
  title: ELOM API
  version: 1.0.0
  description: Energy Life — учёт закупок, остатки, архив, отчёты (v1)
paths:
  /api/v1/archive/:
    get:
      operationId: archive_list
      description: Архивные периоды (месяц×объект), отсортированы по убыванию месяца.
      summary: Список закрытых периодов
      parameters:
      - in: query
        name: object
        schema:
          type: integer
        description: Фильтр по объекту (если предусмотрен в фильтре)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: month|closed_at (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArchivePeriodList'
              examples:
                ПримерОтвета(страница):
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 3
                        month: '2025-09-01'
                        object: 1
                        object_name: Объект А
                        closed_at: '2025-09-30T18:05:00Z'
                        closed_by: 2
                        closed_by_name: Director
                  summary: Пример ответа (страница)
          description: ''
  /api/v1/archive/{id}/:
    get:
      operationId: archive_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
          description: ''
  /api/v1/archive/close/:
    post:
      operationId: archive_close_create
      description: Помечает закупки и снимки за месяц как read-only (`is_archived=true`).
      summary: Закрыть период (месяц×объект)
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
        required: true
      - in: query
        name: object
        schema:
          type: integer
        description: ID объекта
        required: true
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
            examples:
              ПримерУспешногоОтвета:
                value:
                  id: 4
                  month: '2025-09-01'
                  object: 1
                  object_name: Объект А
                  closed_at: '2025-09-30T18:05:00Z'
                  closed_by: 2
                  closed_by_name: Director
                summary: Пример успешного ответа
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
              examples:
                ПримерУспешногоОтвета:
                  value:
                    id: 4
                    month: '2025-09-01'
                    object: 1
                    object_name: Объект А
                    closed_at: '2025-09-30T18:05:00Z'
                    closed_by: 2
                    closed_by_name: Director
                  summary: Пример успешного ответа
          description: ''
        '400':
          description: invalid params / already closed
        '403':
          description: forbidden
  /api/v1/archive/periods/:
    get:
      operationId: archive_periods_list
      description: Архивные периоды (месяц×объект), отсортированы по убыванию месяца.
      summary: Список закрытых периодов
      parameters:
      - in: query
        name: object
        schema:
          type: integer
        description: Фильтр по объекту (если предусмотрен в фильтре)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: month|closed_at (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArchivePeriodList'
              examples:
                ПримерОтвета(страница):
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 3
                        month: '2025-09-01'
                        object: 1
                        object_name: Объект А
                        closed_at: '2025-09-30T18:05:00Z'
                        closed_by: 2
                        closed_by_name: Director
                  summary: Пример ответа (страница)
          description: ''
  /api/v1/archive/periods/{id}/:
    get:
      operationId: archive_periods_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this archive period.
        required: true
      tags:
      - archive
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
          description: ''
  /api/v1/archive/periods/close/:
    post:
      operationId: archive_periods_close_create
      description: Помечает закупки и снимки за месяц как read-only (`is_archived=true`).
      summary: Закрыть период (месяц×объект)
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
        required: true
      - in: query
        name: object
        schema:
          type: integer
        description: ID объекта
        required: true
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
            examples:
              ПримерУспешногоОтвета:
                value:
                  id: 4
                  month: '2025-09-01'
                  object: 1
                  object_name: Объект А
                  closed_at: '2025-09-30T18:05:00Z'
                  closed_by: 2
                  closed_by_name: Director
                summary: Пример успешного ответа
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivePeriodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePeriod'
              examples:
                ПримерУспешногоОтвета:
                  value:
                    id: 4
                    month: '2025-09-01'
                    object: 1
                    object_name: Объект А
                    closed_at: '2025-09-30T18:05:00Z'
                    closed_by: 2
                    closed_by_name: Director
                  summary: Пример успешного ответа
          description: ''
        '400':
          description: invalid params / already closed
        '403':
          description: forbidden
  /api/v1/archive/periods/reopen/:
    post:
      operationId: archive_periods_reopen_create
      description: Снимает архив с закупок и снапшотов за указанный месяц и объект.
      summary: Открыть ранее закрытый период
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: forbidden
        '404':
          description: not found
  /api/v1/archive/reopen/:
    post:
      operationId: archive_reopen_create
      description: Снимает архив с закупок и снапшотов за указанный месяц и объект.
      summary: Открыть ранее закрытый период
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: forbidden
        '404':
          description: not found
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Просмотр журнала аудита системы. Доступно только администраторам
        и директорам.
      summary: Журнал аудита
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: 'Фильтр: действие (create, update, delete, etc.)'
      - in: query
        name: detail
        schema:
          type: string
        description: 'Фильтр: детали'
      - in: query
        name: ip
        schema:
          type: string
        description: 'Фильтр: IP адрес'
      - in: query
        name: model
        schema:
          type: string
        description: 'Фильтр: модель (Unit, Material, Purchase, etc.)'
      - in: query
        name: object_id
        schema:
          type: string
        description: 'Фильтр: ID объекта'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: ts (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по деталям
      - in: query
        name: ts_from
        schema:
          type: string
        description: 'Фильтр: с даты (формат: YYYY-MM-DDTHH:MM:SS)'
      - in: query
        name: ts_to
        schema:
          type: string
        description: 'Фильтр: по дату (формат: YYYY-MM-DDTHH:MM:SS)'
      - in: query
        name: user
        schema:
          type: integer
        description: 'Фильтр: ID пользователя'
      - in: query
        name: user_name
        schema:
          type: string
        description: 'Фильтр: имя пользователя'
      tags:
      - Common
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      summary: Получить запись аудита
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - Common
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/employees/:
    get:
      operationId: employees_list
      description: Поиск по username/first_name/last_name/email; фильтры по роли,
        активности и объекту.
      summary: Список сотрудников
      parameters:
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: first_name
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
        description: 'Фильтр: активность'
      - in: query
        name: is_staff
        schema:
          type: boolean
      - in: query
        name: is_superuser
        schema:
          type: boolean
      - in: query
        name: last_name
        schema:
          type: string
      - in: query
        name: object
        schema:
          type: integer
        description: 'Фильтр: ID объекта (ответственный)'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: username|first_name|last_name|id'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: 'Фильтр: роль (admin|buyer|site_manager|director|coordinator|brigadier)'
      - in: query
        name: search
        schema:
          type: string
        description: 'Поиск: username|first_name|last_name|email'
      - in: query
        name: username
        schema:
          type: string
      tags:
      - Employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeList'
          description: ''
    post:
      operationId: employees_create
      summary: Создать сотрудника
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: employees_retrieve
      summary: Получить сотрудника
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - Employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    put:
      operationId: employees_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employees_partial_update
      summary: Обновить сотрудника
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    delete:
      operationId: employees_destroy
      summary: Удалить сотрудника
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - Employees
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/{id}/set_password/:
    post:
      operationId: employees_set_password
      summary: Сменить пароль сотруднику
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this пользователь.
        required: true
      tags:
      - Employees
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: invalid payload / forbidden
  /api/v1/material-categories/:
    get:
      operationId: material_categories_list
      description: Пагинация, поиск и сортировка. Поиск по `name`. Поддержка иерархии.
      summary: Список категорий материалов
      parameters:
      - in: query
        name: has_children
        schema:
          type: boolean
        description: 'Фильтр: только категории с дочерними (true) или без (false)'
      - in: query
        name: has_materials
        schema:
          type: boolean
        description: 'Фильтр: только категории с материалами (true) или без (false)'
      - in: query
        name: has_parent
        schema:
          type: boolean
        description: 'Фильтр: только корневые категории (false) или только дочерние
          (true)'
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: name (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
        description: 'Фильтр: ID родительской категории'
      - in: query
        name: search
        schema:
          type: string
        description: 'Поиск: name'
      tags:
      - Common
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaterialCategoryList'
          description: ''
    post:
      operationId: material_categories_create
      summary: Создать категорию
      tags:
      - Common
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
  /api/v1/material-categories/{id}/:
    get:
      operationId: material_categories_retrieve
      summary: Получить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material category.
        required: true
      tags:
      - Common
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    put:
      operationId: material_categories_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material category.
        required: true
      tags:
      - material-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    patch:
      operationId: material_categories_partial_update
      summary: Обновить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material category.
        required: true
      tags:
      - Common
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    delete:
      operationId: material_categories_destroy
      summary: Удалить категорию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material category.
        required: true
      tags:
      - Common
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/material-categories/children/:
    get:
      operationId: material_categories_children
      description: Возвращает все дочерние категории для указанной родительской категории
        с пагинацией
