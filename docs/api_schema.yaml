          type: string
      - in: query
        name: object
        schema:
          type: integer
        description: 'Фильтр: ID объекта (сотрудники ответственные за объект)'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: username|first_name|last_name|id (используйте ''-''
