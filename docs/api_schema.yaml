        \ — Администратор (только через Django Admin)\n        - `director` — Директор\
        \ (полный доступ ко всем данным)\n        - `coordinator` — Координатор (координация\
        \ между объектами)\n        - `brigadier` — Бригадир (работа с назначенными\
        \ объектами)\n        "
