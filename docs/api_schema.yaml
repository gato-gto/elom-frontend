      description: "\n        Закрывает период для объекта, помечая все закупки и\
        \ снимки за указанный месяц как архивированные.\n        \n        **Бизнес-логика:**\n\
        \        - Устанавливает `is_archived=True` для всех закупок за месяц\n  \
        \      - Устанавливает `is_archived=True` для всех снимков за месяц\n    \
        \    - Создает запись в `ArchivePeriod`\n        - Запрещает редактирование\
        \ архивированных данных\n        \n        **Права доступа:**\n        - Только\
