  /api/v1/purchases/import/commit/:
    post:
      operationId: purchases_import_commit
      description: "\n        Создать закупки и позиции из Excel-файла.\n        \n\
        \        **Важно:** Перед вызовом рекомендуется выполнить dry_run для проверки\
        \ данных.\n        \n        **Логика группировки:**\n        Строки с одинаковыми\
        \ (date, object, supplier, invoice_number) объединяются в одну закупку.\n\
        \        Каждая уникальная комбинация создает отдельную закупку.\n       \
        \ \n        **Идемпотентность:**\n        Хеш файла сохраняется в комментарии\
        \ закупки: `[import:{hash}]`.\n        Повторный импорт того же файла пропускается.\n\
        \        \n        **Возвращает:**\n        - `created` — количество созданных\
        \ закупок\n        - `content_hash` — хеш импортированного файла\n        "
      summary: 'Шаг 3: Фактический импорт'
      tags:
      - Purchases • Import
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel файл (.xlsx)
                mapping:
                  type: object
                  description: Маппинг колонок
              required:
              - file
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Импорт завершен
        '200':
          description: Файл уже был импортирован ранее
        '400':
          description: Файл не предоставлен или ошибка импорта
        '401':
          description: Не авторизован
  /api/v1/purchases/import/dry_run/:
    post:
      operationId: purchases_import_dry_run
      description: "\n        Проверить данные файла без сохранения в БД.\n      \
        \  \n        **Требуется передать:**\n        - `file` — Excel файл (тот же\
        \ что в prepare)\n        - `mapping` — маппинг колонок (из ответа prepare\
        \ или скорректированный)\n        \n        **Проверки:**\n        - Корректность\
        \ дат (форматы: YYYY-MM-DD, DD.MM.YYYY, DD/MM/YYYY)\n        - Наличие обязательных\
        \ полей (date, object, material, quantity > 0)\n        - Существование объектов\
        \ в справочнике\n        - Существование материалов в справочнике\n      \
        \  - Существование единиц измерения в справочнике\n        \n        **Возвращает:**\n\
        \        - `rows_scanned` — количество проверенных строк\n        - `errors`\
        \ — массив ошибок с указанием строки и поля\n        "
      summary: 'Шаг 2: Проверка данных (dry-run)'
      tags:
      - Purchases • Import
      requestBody:
        content:
          multipart/form-data:
            schema:
