  /api/v1/archive/periods/reopen/:
    post:
      operationId: archive_periods_reopen_create
      description: Снимает архив с закупок и снапшотов за указанный месяц и объект.
      summary: Открыть ранее закрытый период
      tags:
      - Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_ReopenInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: forbidden
        '404':
          description: not found
  /api/v1/archive/reopen/:
    post:
      operationId: archive_reopen_create
      description: Снимает архив с закупок и снапшотов за указанный месяц и объект.
      summary: Открыть ранее закрытый период
      tags:
      - Archive
      requestBody:
        content:
