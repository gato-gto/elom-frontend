      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                ПримерОтвета:Директор:
                  value:
                    id: 1
                    username: director
                    email: director@elom.uz
                    first_name: Иван
                    last_name: Директоров
                    role: director
                    is_active: true
                  summary: 'Пример ответа: Директор'
                ПримерОтвета:Бригадир:
                  value:
                    id: 5
                    username: brigadier1
                    email: brigadier1@elom.uz
                    first_name: Азиз
                    last_name: Бригадиров
                    role: brigadier
                    is_active: true
                  summary: 'Пример ответа: Бригадир'
          description: ''
        '401':
          description: Не авторизован. Требуется JWT токен.
