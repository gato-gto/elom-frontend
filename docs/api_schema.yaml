                        resource: materials
                        action: create
                        description: Разрешение на создание новых материалов
                        is_active: true
                      - id: 2
                        codename: purchases.view
                        name: Просмотр закупок
                        resource: purchases
                        action: view
                        description: Разрешение на просмотр закупок
                        is_active: true
                  summary: Пример ответа
          description: ''
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа (требуется rbac.view)
