  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Просмотр журнала аудита системы. Администраторы и директора видят
        все записи, остальные — только свои.
      summary: Журнал аудита
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: 'Фильтр: действие (create, update, delete, photo_upload, etc.)'
      - in: query
        name: detail
        schema:
          type: string
        description: 'Фильтр: детали операции'
      - in: query
        name: ip
        schema:
          type: string
        description: 'Фильтр: IP адрес клиента'
      - in: query
        name: model
        schema:
          type: string
        description: 'Фильтр: модель (Unit, Material, Purchase, StockSnapshot, etc.)'
      - in: query
        name: object_id
        schema:
          type: string
        description: 'Фильтр: ID объекта аудита'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: ts|user|action|model (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по деталям
      - in: query
        name: ts_from
        schema:
          type: string
        description: 'Фильтр: с даты (формат: YYYY-MM-DDTHH:MM:SS)'
      - in: query
        name: ts_to
        schema:
          type: string
        description: 'Фильтр: по дату (формат: YYYY-MM-DDTHH:MM:SS)'
      - in: query
        name: user
        schema:
          type: integer
        description: 'Фильтр: ID пользователя'
      - in: query
        name: user_name
        schema:
          type: string
        description: 'Фильтр: имя пользователя'
      tags:
      - Audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '401':
          description: Не авторизован
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Получить детальную информацию о записи аудита по ID.
      summary: Получить запись аудита
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - Audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
        '401':
          description: Не авторизован
        '404':
          description: Запись не найдена
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: "\n    Аутентификация пользователя и получение пары JWT токенов.\n\
        \    \n    **Запрос:** username + password\n    **Ответ:** access token (15\
        \ мин) + refresh token (1 день)\n    \n    Используйте access token в заголовке:\
        \ `Authorization: Bearer <token>`\n    "
      summary: Получить JWT токен
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: "\n    Обновление access токена с использованием refresh токена.\n\
        \    \n    **Запрос:** refresh token\n    **Ответ:** новый access token\n\
        \    \n    Вызывайте этот endpoint когда access token истекает.\n    "
      summary: Обновить JWT токен
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
