        Положительное quantity_signed = приход, отрицательное = расход.

        **Источники снапшотов (source_type):**
        - `purchase` — из закупки (приход)
        - `writeoff` — из списания (расход)
        - `manual` — ручная корректировка
        - `import` — из импорта

        **Этапы работ (stage):**
        - `acceptance` — приёмка
        - `request` — заявка
        - `delivery_fixed` — фиксированная доставка
        - `post_rough` — после черновой отделки
        - `handover` — сдача

        **Дополнительные действия:**
        - `balance` — текущий остаток материала
        - `by-objects` — остатки по объектам
