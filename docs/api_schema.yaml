  /api/v1/writeoffs/from-balance/:
    post:
      operationId: writeoffs_from_balance_create
      description: |-
        F-213 / D-015: второй способ оформить расход. Пользователь вводит ФАКТИЧЕСКИЙ остаток материала на объекте; система вычисляет расход = книжный остаток − факт и создаёт списание на разницу (через обычный путь WriteOff: скоуп, ответственный, леджер, аудит).

        w4-2: unit и quantity в теле запроса НЕ передаются — сервер вычисляет их сам (unit — из Material.default_unit, quantity — book − target_balance).
      summary: Списание по фактическому остатку (инвентаризация)
      tags:
      - WriteOffs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_FromBalanceInputRequest'
            examples:
              ПримерЗапроса:
                value:
                  object: 1
                  material: 5
                  target_balance: '70.000'
                  date: '2025-09-21'
                  comment: Инвентаризация склада
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_FromBalanceInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_FromBalanceInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOff'
          description: ''
        '400':
          description: Отсутствуют/некорректны поля, отрицательный/превышающий книжный
            остаток, или нулевой расход
        '403':
          description: Нет доступа к объекту (F-275)
