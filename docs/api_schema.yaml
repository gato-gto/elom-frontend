components:
  schemas:
    ArchivePeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        month:
          type: string
          format: date
        object:
          type: integer
        object_name:
          type: string
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
        closed_by:
          type: integer
          readOnly: true
        closed_by_name:
          type: string
          readOnly: true
        is_closed:
          type: boolean
          readOnly: true
      required:
      - closed_at
      - closed_by
      - closed_by_name
      - id
      - is_closed
      - month
      - object
      - object_name
    ArchivePeriodRequest:
      type: object
      properties:
        month:
          type: string
          format: date
        object:
          type: integer
      required:
      - month
      - object
