          type: boolean
        description: Фильтр по активности (true/false)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: resource, action, name (используйте ''-'' для desc)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource
        schema:
          type: string
        description: Фильтр по ресурсу (materials, purchases, objects и т.д.)
      - in: query
        name: search
