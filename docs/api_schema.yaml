          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockSnapshotList'
              examples:
                ПримерОтвета(страница):
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: 11
                        date: '2025-09-11'
                        object: 1
                        object_name: Объект А
                        material: 5
                        material_name: Кабель ВВГ
                        unit: 2
                        unit_code: м
                        quantity_signed: '12.500'
                        stage: post_rough
                        responsible: 3
                        comment: ''
                        is_archived: false
                        current_balance: '15.000'
                        created_at: '2025-09-11T08:10:00Z'
                        updated_at: '2025-09-11T08:10:00Z'
                  summary: Пример ответа (страница)
          description: ''
    post:
      operationId: stock_snapshots_create
      description: |-
        ViewSet для управления снапшотами остатков (Unified Ledger Model).

        StockSnapshot — единая запись движения материала.
        Положительное quantity_signed = приход, отрицательное = расход.

        **Источники снапшотов (source_type):**
        - `purchase` — из закупки (приход)
        - `writeoff` — из списания (расход)
        - `manual` — ручная корректировка
        - `import` — из импорта

        **Этапы работ (stage):**
        - `acceptance` — приёмка
        - `request` — заявка
        - `delivery_fixed` — фиксированная доставка
        - `post_rough` — после черновой отделки
        - `handover` — сдача

        **Дополнительные действия:**
        - `balance` — текущий остаток материала
        - `by-objects` — остатки по объектам
        - `history` — история изменений остатка

        **Права доступа:**
        - Директор/Админ/Координатор — полный доступ
        - Бригадир — только свои объекты
      summary: Создать снапшот
      tags:
      - Stock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockSnapshotRequest'
            examples:
              ПримерЗапроса:
                value:
                  date: '2025-09-11'
                  object: 1
                  material: 5
                  unit: 2
                  quantity: '12.500'
                  stage: post_rough
                  responsible: 3
                  comment: ''
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockSnapshotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockSnapshotRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSnapshot'
          description: ''
        '400':
          description: Ошибка валидации
