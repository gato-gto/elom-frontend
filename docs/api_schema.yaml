      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ts:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
        user_role:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        action_display:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        model_display:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        detail:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
